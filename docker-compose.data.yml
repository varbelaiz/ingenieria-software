services:
  warehouse:
    image: postgres:16
    environment:
      POSTGRES_USER: ${WAREHOUSE_USER:-warehouse}
      POSTGRES_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
      POSTGRES_DB: ${WAREHOUSE_DB:-warehouse}
    ports:
      - "5433:5432"
    volumes:
      - warehouse_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_USER:-warehouse}"]
      interval: 5s
      timeout: 5s
      retries: 10

  dagster-webserver:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    command: dagster-webserver -h 0.0.0.0 -p 3001 -w workspace.yaml
    ports:
      - "3001:3001"
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: ${WAREHOUSE_USER:-warehouse}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
    volumes:
      - dagster_home:/opt/dagster/dagster_home
      - ./data_platform:/opt/dagster/app/data_platform

  dagster-daemon:
    build:
      context: .
      dockerfile: Dockerfile.dagster
    command: dagster-daemon run
    depends_on:
      warehouse:
        condition: service_healthy
    environment:
      DAGSTER_HOME: /opt/dagster/dagster_home
      WAREHOUSE_HOST: warehouse
      WAREHOUSE_PORT: "5432"
      WAREHOUSE_USER: ${WAREHOUSE_USER:-warehouse}
      WAREHOUSE_PASSWORD: ${WAREHOUSE_PASSWORD:-warehouse}
      WAREHOUSE_DB: ${WAREHOUSE_DB:-warehouse}
    volumes:
      - dagster_home:/opt/dagster/dagster_home
      - ./data_platform:/opt/dagster/app/data_platform

volumes:
  warehouse_data:
  dagster_home:
