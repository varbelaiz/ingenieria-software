name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  API_KEY: "test-api-key"

jobs:
  lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync

      - name: Run pre-commit hooks
        run: uv run pre-commit run --all-files

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install dependencies
        run: uv sync

      - name: Run tests with coverage
        run: uv run pytest --cov=app --cov-report=term-missing

  data-extraction-test:
    runs-on: ubuntu-latest

    services:
      warehouse:
        image: postgres:16
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U warehouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      TEST_WAREHOUSE_HOST: localhost
      TEST_WAREHOUSE_PORT: "5433"
      TEST_WAREHOUSE_USER: warehouse
      TEST_WAREHOUSE_PASSWORD: warehouse
      TEST_WAREHOUSE_DB: warehouse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install data dependencies
        run: uv sync --group data

      - name: Run bronze extraction tests
        run: uv run --group data pytest tests/test_extraction_clients.py tests/test_extraction_idempotency.py tests/test_bronze_schema.py

  scan:
    runs-on: ubuntu-latest
    needs: []

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Build Docker image
        run: docker build -t forecast-api:${{ github.sha }} .

      - name: Scan image for vulnerabilities (Trivy)
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: forecast-api:${{ github.sha }}
          format: table
          severity: CRITICAL,HIGH
          exit-code: "0"

  dbt-parse:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install data dependencies
        run: uv sync --group data --no-dev

      - name: Install dbt packages
        run: uv run --group data dbt deps --project-dir data_platform/transform --profiles-dir data_platform/transform

      - name: Validate dbt project parses cleanly
        run: uv run --group data dbt parse --project-dir data_platform/transform --profiles-dir data_platform/transform

  dagster-validate:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install data dependencies
        run: uv sync --group data --no-dev

      - name: Install dbt packages
        run: uv run --group data dbt deps --project-dir data_platform/transform --profiles-dir data_platform/transform

      - name: Generate dbt manifest for dagster-dbt
        run: uv run --group data dbt parse --project-dir data_platform/transform --profiles-dir data_platform/transform

      - name: Validate Dagster Definitions load
        run: uv run --group data dagster definitions validate -m data_platform.orchestration

  datahub-recipe-validate:
    runs-on: ubuntu-latest

    services:
      warehouse:
        image: postgres:16
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U warehouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5433"
      WAREHOUSE_USER: warehouse
      WAREHOUSE_PASSWORD: warehouse
      WAREHOUSE_DB: warehouse
      DBT_WAREHOUSE_HOST: localhost
      DBT_WAREHOUSE_PORT: "5433"
      DBT_WAREHOUSE_USER: warehouse
      DBT_WAREHOUSE_PASSWORD: warehouse
      DBT_WAREHOUSE_DB: warehouse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install data dependencies
        run: uv sync --group data --no-dev

      - name: Install dbt packages
        run: uv run --group data dbt deps --project-dir data_platform/transform --profiles-dir data_platform/transform

      - name: Generate dbt manifest for dagster-dbt
        run: uv run --group data dbt parse --project-dir data_platform/transform --profiles-dir data_platform/transform

      - name: Seed bronze fixtures
        run: uv run --group data python -m data_platform.ci.seed_bronze

      - name: Generate source freshness metadata
        run: uv run --group data dbt source freshness --project-dir data_platform/transform --profiles-dir data_platform/transform

      - name: Generate dbt build metadata
        run: uv run --group data dbt build --select silver gold --project-dir data_platform/transform --profiles-dir data_platform/transform

      - name: Preserve dbt build run results
        run: cp data_platform/transform/target/run_results.json data_platform/transform/target/run_results_build.json

      - name: Generate dbt docs metadata
        run: uv run --group data dbt docs generate --project-dir data_platform/transform --profiles-dir data_platform/transform

      - name: Restore dbt build run results
        run: cp data_platform/transform/target/run_results_build.json data_platform/transform/target/run_results.json

      - name: Validate Postgres DataHub recipe
        run: uvx --python 3.10 --from "acryl-datahub[postgres,dbt]>=1.4,<1.5" datahub ingest -c data_platform/governance/recipes/ci/postgres.yml --dry-run --no-default-report

      - name: Validate dbt DataHub recipe
        run: uvx --python 3.10 --from "acryl-datahub[postgres,dbt]>=1.4,<1.5" datahub ingest -c data_platform/governance/recipes/ci/dbt.yml --dry-run --no-default-report

  dbt-test:
    runs-on: ubuntu-latest

    services:
      warehouse:
        image: postgres:16
        env:
          POSTGRES_USER: warehouse
          POSTGRES_PASSWORD: warehouse
          POSTGRES_DB: warehouse
        ports:
          - 5433:5432
        options: >-
          --health-cmd "pg_isready -U warehouse"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    env:
      WAREHOUSE_HOST: localhost
      WAREHOUSE_PORT: "5433"
      WAREHOUSE_USER: warehouse
      WAREHOUSE_PASSWORD: warehouse
      WAREHOUSE_DB: warehouse
      DBT_WAREHOUSE_HOST: localhost
      DBT_WAREHOUSE_PORT: "5433"
      DBT_WAREHOUSE_USER: warehouse
      DBT_WAREHOUSE_PASSWORD: warehouse
      DBT_WAREHOUSE_DB: warehouse

    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.10"

      - name: Install data dependencies
        run: uv sync --group data --no-dev

      - name: Install dbt packages
        run: uv run --group data dbt deps --project-dir data_platform/transform --profiles-dir data_platform/transform

      - name: Generate dbt manifest for dagster-dbt
        run: uv run --group data dbt parse --project-dir data_platform/transform --profiles-dir data_platform/transform

      - name: Seed bronze fixtures
        run: uv run --group data python -m data_platform.ci.seed_bronze

      - name: Validate source freshness
        run: uv run --group data dbt source freshness --project-dir data_platform/transform --profiles-dir data_platform/transform

      - name: Build silver and gold models with quality gates
        run: uv run --group data dbt build --select silver gold --project-dir data_platform/transform --profiles-dir data_platform/transform

      - name: Run data quality tests
        run: uv run --group data pytest tests/test_quality_persistence.py

      - name: Validate Metabase card SQL against gold
        run: uv run --group data pytest tests/test_metabase_cards_sql.py
