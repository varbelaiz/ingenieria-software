name: CD

on:
  push:
    branches: [main, develop]
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"
  AWS_REGION: ${{ secrets.AWS_REGION }}
  ECR_REGISTRY: ${{ secrets.ECR_REGISTRY }}

jobs:
  changes:
    name: Resolve env and changed paths
    runs-on: ubuntu-latest
    outputs:
      env_name: ${{ steps.env.outputs.env_name }}
      api: ${{ steps.filter.outputs.api }}
      stack: ${{ steps.filter.outputs.stack }}
    steps:
      - uses: actions/checkout@v5

      - name: Resolve environment from branch
        id: env
        run: |
          if [[ "${{ github.ref }}" == "refs/heads/main" ]]; then
            echo "env_name=prod" >> $GITHUB_OUTPUT
          else
            echo "env_name=staging" >> $GITHUB_OUTPUT
          fi

      - name: Filter changed paths
        id: filter
        uses: dorny/paths-filter@v3
        with:
          filters: |
            api:
              - 'app/**'
              - 'Dockerfile'
              - 'pyproject.toml'
              - 'uv.lock'
            stack:
              - 'grafana/**'
              - 'prometheus/**'
              - 'docker-compose.prod.yml'

  build-and-push:
    name: Build and push image to ECR
    runs-on: ubuntu-latest
    needs: changes
    if: needs.changes.outputs.api == 'true' || github.event_name == 'workflow_dispatch'

    steps:
      - uses: actions/checkout@v5

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2

      - name: Build and push Docker image
        run: |
          IMAGE=${{ env.ECR_REGISTRY }}/api-${{ needs.changes.outputs.env_name }}:latest
          docker build --target base -t $IMAGE .
          docker push $IMAGE

  deploy:
    name: Deploy stack to EC2 via SSM
    runs-on: ubuntu-latest
    needs: [changes, build-and-push]
    if: |
      always() &&
      needs.changes.result == 'success' &&
      (needs.build-and-push.result == 'success' || needs.build-and-push.result == 'skipped') &&
      (github.event_name == 'workflow_dispatch' ||
       needs.changes.outputs.api == 'true' ||
       needs.changes.outputs.stack == 'true')

    steps:
      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Send deploy command via SSM
        run: |
          ENV_NAME=${{ needs.changes.outputs.env_name }}
          aws ssm send-command \
            --document-name "AWS-RunShellScript" \
            --targets "Key=tag:Name,Values=app-$ENV_NAME" \
            --parameters commands="[
              \"cd /opt/app\",
              \"git pull\",
              \"aws ecr get-login-password --region ${{ env.AWS_REGION }} | docker login --username AWS --password-stdin ${{ env.ECR_REGISTRY }}\",
              \"AWS_REGION=${{ env.AWS_REGION }} ENVIRONMENT=$ENV_NAME ECR_REGISTRY=${{ env.ECR_REGISTRY }} ECR_REPOSITORY=api-$ENV_NAME GF_SECURITY_ADMIN_USER=admin bash scripts/write_runtime_env.sh\",
              \"docker compose -f docker-compose.prod.yml pull\",
              \"docker compose -f docker-compose.prod.yml up -d\",
              \"bash scripts/sync_grafana_admin_password.sh\"
            ]" \
            --region ${{ env.AWS_REGION }}
