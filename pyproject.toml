[project]
name = "ingenieria-software"
version = "0.1.0"
description = "Plataforma predictiva de producción de hidrocarburos"
requires-python = ">=3.10,<3.15"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
    "python-dotenv>=1.2.2",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "black>=24.10.0,<25.0.0",
    "flake8>=7.1.0,<8.0.0",
    "locust>=2.31.0,<3.0.0",
    "pylint>=3.3.0,<4.0.0",
    "mypy>=1.13.0,<2.0.0",
    "pytest-asyncio>=1.3.0",
]

data = [
    "dbt-core>=1.8,<2.0",
    "dbt-postgres>=1.8,<2.0",
    "dagster>=1.8,<2.0",
    "dagster-webserver>=1.8,<2.0",
    "dagster-dbt>=0.20,<1.0",
    "psycopg2-binary>=2.9,<3.0",
    "requests>=2.31,<3.0",
]

ml = [
    "mlflow>=3.1.0,<4.0.0",
]

[tool.pytest.ini_options]
asyncio_mode = "auto"
