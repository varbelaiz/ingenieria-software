[project]
name = "ingenieria-software"
version = "0.1.0"
description = "Plataforma predictiva de producción de hidrocarburos"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115.0,<1.0.0",
    "uvicorn[standard]>=0.34.0,<1.0.0",
    "httpx>=0.28.0,<1.0.0",
]

[dependency-groups]
dev = [
    "pytest>=8.0.0,<9.0.0",
    "pytest-cov>=6.0.0,<7.0.0",
    "pre-commit>=4.0.0,<5.0.0",
    "black>=24.10.0,<25.0.0",
    "flake8>=7.1.0,<8.0.0",
    "pylint>=3.3.0,<4.0.0",
    "mypy>=1.13.0,<2.0.0",
]

