name: ingenieria_software
version: "1.0.0"
config-version: 2

profile: ingenieria_software

model-paths: ["models"]
test-paths: ["tests"]
seed-paths: ["seeds"]
macro-paths: ["macros"]
snapshot-paths: ["snapshots"]
analysis-paths: ["analyses"]

target-path: "target"
clean-targets:
  - "target"
  - "dbt_packages"

models:
  ingenieria_software:
    bronze:
      +materialized: table
      +schema: bronze
    silver:
      +materialized: incremental
      +schema: silver
    gold:
      +materialized: table
      +schema: gold

data_tests:
  +store_failures: false
  +schema: dbt_test_failures
