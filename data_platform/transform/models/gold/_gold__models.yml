version: 2

models:
  - name: dim_pozo
    description: "Dimension de pozos con clave surrogate y columnas compatibles con SCD Tipo 2."
    columns:
      - name: pozo_key
        description: "Clave surrogate del pozo."
        data_tests:
          - not_null
          - unique
      - name: id_pozo
        description: "Identificador natural del pozo."
        data_tests:
          - not_null
          - unique
      - name: valid_from
        description: "Inicio de vigencia del registro actual."
        data_tests:
          - not_null
      - name: valid_to
        description: "Fin de vigencia; null para el registro actual."
      - name: is_current
        description: "Marca de registro vigente."
        data_tests:
          - not_null

  - name: dim_empresa
    description: "Dimension de empresas operadoras con clave surrogate y columnas compatibles con SCD Tipo 2."
    columns:
      - name: empresa_key
        description: "Clave surrogate de la empresa."
        data_tests:
          - not_null
          - unique
      - name: id_empresa
        description: "Identificador natural normalizado de la empresa."
        data_tests:
          - not_null
          - unique
      - name: valid_from
        description: "Inicio de vigencia del registro actual."
        data_tests:
          - not_null
      - name: is_current
        description: "Marca de registro vigente."
        data_tests:
          - not_null

  - name: dim_area
    description: "Dimension de areas productivas."
    columns:
      - name: area_key
        description: "Clave surrogate del area."
        data_tests:
          - not_null
          - unique
      - name: area
        description: "Nombre normalizado del area."
        data_tests:
          - not_null
          - unique

  - name: dim_cuenca
    description: "Dimension de cuencas productivas."
    columns:
      - name: cuenca_key
        description: "Clave surrogate de la cuenca."
        data_tests:
          - not_null
          - unique
      - name: cuenca
        description: "Nombre normalizado de la cuenca."
        data_tests:
          - not_null
          - unique

  - name: dim_tipo_recurso
    description: "Dimension de tipos de recurso."
    columns:
      - name: tipo_recurso_key
        description: "Clave surrogate del tipo de recurso."
        data_tests:
          - not_null
          - unique
      - name: tipo_recurso
        description: "Tipo de recurso normalizado."
        data_tests:
          - not_null
          - unique

  - name: dim_fecha
    description: "Dimension calendario mensual para la produccion."
    columns:
      - name: fecha_key
        description: "Clave surrogate del periodo mensual."
        data_tests:
          - not_null
          - unique
      - name: periodo
        description: "Primer dia del mes de produccion."
        data_tests:
          - not_null
          - unique

  - name: fct_produccion
    description: "Fact table de produccion mensual. Grano: un pozo por periodo."
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              - id_pozo
              - periodo
    columns:
      - name: produccion_key
        description: "Clave surrogate de la fila fact."
        data_tests:
          - not_null
          - unique
      - name: pozo_key
        description: "FK a dim_pozo."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_pozo')
                field: pozo_key
      - name: empresa_key
        description: "FK a dim_empresa."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_empresa')
                field: empresa_key
      - name: area_key
        description: "FK a dim_area."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_area')
                field: area_key
      - name: cuenca_key
        description: "FK a dim_cuenca."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_cuenca')
                field: cuenca_key
      - name: tipo_recurso_key
        description: "FK a dim_tipo_recurso."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_tipo_recurso')
                field: tipo_recurso_key
      - name: fecha_key
        description: "FK a dim_fecha."
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_fecha')
                field: fecha_key
      - name: id_pozo
        description: "Clave natural del pozo para auditoria del grano."
        data_tests:
          - not_null
      - name: periodo
        description: "Periodo mensual de produccion."
        data_tests:
          - not_null
      - name: prod_gas
        description: "Produccion de gas del periodo."
        data_tests:
          - not_null
      - name: prod_petroleo
        description: "Produccion de petroleo del periodo."
        data_tests:
          - not_null
      - name: prod_agua
        description: "Produccion de agua del periodo."
        data_tests:
          - not_null
      - name: dias_produccion
        description: "Dias de produccion del periodo."
        data_tests:
          - not_null
