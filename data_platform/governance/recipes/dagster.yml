# DataHub 1.4.0 documents Dagster metadata emission through
# `acryl_datahub_dagster_plugin` and a Dagster sensor, not through a pull-style
# ingestion source like dbt or Postgres.
#
# This file records the local sensor configuration exposed by
# `data_platform.orchestration.datahub`. Do not run it with `datahub ingest -c`.
dagster_sensor:
  package: acryl_datahub_dagster_plugin
  sensor_name: datahub_sensor
  datahub:
    server: http://localhost:8080
  dagster:
    url: http://localhost:3001
  capture:
    asset_materialization: true
    pipeline_runs: true
    table_lineage: true
  expected_definitions_module: data_platform.orchestration
