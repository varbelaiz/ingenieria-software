# DataHub ingestion recipe for CI validation of local dbt metadata.
# Uses a file sink so GitHub Actions does not need a running DataHub GMS.
source:
  type: dbt
  config:
    manifest_path: data_platform/transform/target/manifest.json
    catalog_path: data_platform/transform/target/catalog.json
    sources_path: data_platform/transform/target/sources.json
    run_results_paths:
      - data_platform/transform/target/run_results.json
    target_platform: postgres
    env: DEV
    entities_enabled:
      catalog_stats: "YES"
      test_results: "YES"

sink:
  type: file
  config:
    filename: /tmp/datahub-dbt-metadata.json
